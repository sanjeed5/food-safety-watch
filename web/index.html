<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A sourced map of publicly reported food-safety inspection events in Bengaluru." />
    <meta name="theme-color" content="#f7f7f4" />
    <meta property="og:title" content="Food Safety Watch Bengaluru" />
    <meta property="og:description" content="Dated inspection evidence with a source on every record." />
    <title>Food Safety Watch Bengaluru</title>
  </head>
  <body>
    <a class="skip-link" href="#records">Skip to inspection records</a>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Food Safety Watch home">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span>Food Safety Watch</span>
      </a>
      <p>Dated reports, not current ratings</p>
      <a class="about-link" href="/about">About &amp; methodology</a>
    </header>

    <main class="explorer" aria-label="Bengaluru food inspection explorer">
      <div class="controls">
        <label class="search-field">
          <span class="visually-hidden">Search inspection records</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" /></svg>
          <input id="search" type="search" placeholder="Search outlet, locality or finding" autocomplete="off" />
        </label>
        <label class="select-field">
          <span class="visually-hidden">Filter by action</span>
          <select id="outcome-filter">
            <option value="all">All actions</option>
          </select>
        </label>
        <div class="result-tools">
          <p id="result-summary" aria-live="polite">Loading records...</p>
          <button id="reset-filters" class="text-button" type="button" hidden>Clear</button>
        </div>
      </div>

      <div class="explorer-grid">
        <div class="map-shell">
          <div id="map" role="region" aria-label="Map of sourced inspection events"></div>
          <p id="map-fallback" class="map-fallback" hidden>The map could not load. Every record remains available in the list.</p>
          <div class="map-key" aria-hidden="true">
            <span><i class="dot dot-notice"></i> Notice</span>
            <span><i class="dot dot-seizure"></i> Seizure</span>
            <span><i class="dot dot-closure"></i> Closure</span>
          </div>
        </div>

        <section id="records" class="records" aria-labelledby="records-title">
          <div class="records-heading">
            <h1 id="records-title">Bengaluru inspection records</h1>
            <span id="last-reviewed"></span>
          </div>
          <div id="record-list" class="record-list"></div>
          <div id="empty-state" class="empty-state" hidden>
            <p>No sourced records match those filters.</p>
            <button class="secondary-button" type="button">Clear filters</button>
          </div>
        </section>
      </div>
    </main>

    <template id="record-template">
      <article class="record-card">
        <div class="record-topline"><span class="record-date"></span><span class="evidence-badge"></span></div>
        <h2 class="record-name"></h2>
        <p class="record-location"></p>
        <dl>
          <div><dt>Reported finding</dt><dd class="record-finding"></dd></div>
          <div><dt>Reported action</dt><dd class="record-action"></dd></div>
          <div><dt>Latest sourced status</dt><dd class="record-status"></dd></div>
        </dl>
        <div class="record-sources"></div>
        <button class="locate-button" type="button">Show on map</button>
      </article>
    </template>

    <script type="module" src="/app.ts"></script>
  </body>
</html>
